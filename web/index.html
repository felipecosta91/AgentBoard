<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0c" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>AgentBoard</title>
    <style>
      html, body { margin: 0; background: #0b0b0c; }
      #splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; place-content: center; gap: 28px; background: #0b0b0c; transition: opacity .5s ease, transform .5s ease; }
      #splash.hide { opacity: 0; transform: scale(1.04); pointer-events: none; }
      #splash img { width: min(38vmin, 240px); border-radius: 22.5%; position: relative; animation: pop .9s cubic-bezier(.2,.9,.3,1.2) both, float 3.2s ease-in-out .9s infinite; box-shadow: 0 20px 60px rgb(56 189 248 / .25); }
      #splash .glow { position: absolute; width: 60vmin; height: 60vmin; border-radius: 50%; background: radial-gradient(circle, rgb(99 102 241 / .35), rgb(34 211 238 / .12) 45%, transparent 70%); animation: pulse 2.4s ease-in-out infinite; }
      #splash .bar { position: relative; width: 140px; height: 3px; border-radius: 3px; background: #26262b; overflow: hidden; }
      #splash .bar i { position: absolute; inset: 0; width: 45%; border-radius: 3px; background: linear-gradient(90deg, #22d3ee, #a78bfa); animation: slide 1.1s ease-in-out infinite; }
      @keyframes pop { from { opacity: 0; transform: scale(.55) rotate(-6deg); } to { opacity: 1; transform: none; } }
      @keyframes float { 50% { transform: translateY(-8px); } }
      @keyframes pulse { 50% { transform: scale(1.15); opacity: .7; } }
      @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(320%); } }
      @media (prefers-reduced-motion: reduce) { #splash * { animation: none !important; } }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="glow"></div>
      <img src="/logo.png" alt="AgentBoard" />
      <div class="bar"><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
